<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>送貨到站確認</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f0e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    .title { font-size: 18px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #888; margin-bottom: 24px; }
    .status {
      font-size: 15px;
      color: #555;
      background: #f5f0e8;
      border-radius: 12px;
      padding: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .status.success { background: #f0fdf4; color: #166534; }
    .status.error   { background: #fef2f2; color: #991b1b; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #e5e7eb;
      border-top-color: #1a1a1a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card">
  <div id="content">
    <div class="spinner"></div>
    <div class="title">位置驗證中</div>
    <div class="subtitle">正在取得您的 GPS 位置…</div>
  </div>
</div>

<script>
const LIFF_ID    = "{{ liff_id }}";
const COMPLETE_URL = "/liff/delivery/complete/";


// ── GPS 取得：持續監聽到精度夠好為止 ──────────────────────
// 不帶 enableHighAccuracy 時瀏覽器會挑最省電的來源：Wi-Fi 掃描或基地台。
// 送貨員多半用行動數據且 Wi-Fi 關閉，等於少了中間那層，一掉就掉到
// 基地台定位（誤差 1~3 公里）。這裡強制走 GPS。
//
// 用 watchPosition 而非重複 getCurrentPosition：GPS 冷啟動時精度是
// 逐步收斂的（先回基地台的粗略值，幾秒後才鎖定衛星），持續監聽才接得到
// 後面那些變準的更新。
const GPS_GOOD_ACCURACY = 50;     // 公尺，達到就立刻採用
const GPS_MAX_WAIT = 20000;       // 最多等 20 秒
const GPS_MIN_WAIT = 3000;        // 至少等 3 秒，給 GPS 收斂的機會

function getBestPosition(onProgress) {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error('no geolocation')); return; }

    let best = null;
    let watchId = null;
    let settled = false;
    const started = Date.now();

    const finish = () => {
      if (settled) return;
      settled = true;
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      clearTimeout(deadline);
      best ? resolve(best) : reject(new Error('no position'));
    };

    const deadline = setTimeout(finish, GPS_MAX_WAIT);

    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        if (!best || pos.coords.accuracy < best.coords.accuracy) best = pos;
        const acc = Math.round(best.coords.accuracy);
        if (onProgress) onProgress(acc, Math.round((Date.now() - started) / 1000));
        // 夠準就走；但至少等一下，避免拿到系統先丟回來的粗略值
        if (acc <= GPS_GOOD_ACCURACY && Date.now() - started >= GPS_MIN_WAIT) finish();
      },
      (err) => { if (!best) { settled = true; clearTimeout(deadline); reject(err); } },
      { enableHighAccuracy: true, timeout: GPS_MAX_WAIT, maximumAge: 0 },
    );
  });
}

async function main() {
  // 先初始化 LIFF，init 完成後 SDK 才會把 liff.state 還原成原始 query string
  await liff.init({ liffId: LIFF_ID });
  if (!liff.isLoggedIn()) { liff.login(); return; }

  const params  = new URLSearchParams(location.search);
  const task_id = params.get('task_id');

  if (!task_id) {
    showError('缺少任務參數，請重新點擊送貨訊息');
    return;
  }

  const profile = await liff.getProfile();
  const line_user_id = profile.userId;

  // 取得 GPS（高精度，必要時多試幾次取最準的）
  let pos;
  try {
    pos = await getBestPosition();
  } catch (e) {
    showError('無法取得 GPS 位置\n請確認已開啟位置權限');
    return;
  }

  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  const accuracy = Math.round(pos.coords.accuracy);

  // 送出驗證
  const res  = await fetch(COMPLETE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ task_id, lat, lng, accuracy, line_user_id }),
  });
  const data = await res.json();

  if (data.ok) {
    showSuccess(data.message);
    setTimeout(() => liff.closeWindow(), 3000);
  } else {
    showError(data.error);
  }
}

function showSuccess(msg) {
  document.getElementById('content').innerHTML = `
    <div class="icon">✅</div>
    <div class="status success">${msg}</div>
    <div class="subtitle" style="margin-top:16px">視窗將自動關閉…</div>`;
}

function showError(msg) {
  document.getElementById('content').innerHTML = `
    <div class="icon">❌</div>
    <div class="status error">${msg}</div>`;
}

main().catch(e => showError('發生錯誤：' + e.message));
</script>
</body>
</html>
